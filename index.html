<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Login — OWASP Juice Shop (mimic)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --toolbar:   #4c7a8c;   /* muted slate-blue app bar          */
      --app-bg:    #121212;   /* near-black page background        */
      --card:      #323232;   /* dark grey login card              */
      --field-bd:  #6f6f6f;   /* input outline (resting)           */
      --field-bd-h:#9a9a9a;   /* input outline (hover)             */
      --ink:       #e8e8e8;   /* primary light text                */
      --muted:     #b5b5b5;   /* field labels / secondary text     */
      --link:      #8bc34a;   /* lime-green links                  */
      --btn:       #5a7d8c;   /* pill "Log in" button              */
      --btn-ready: #4c7a8c;   /* button once form is valid         */
      --error:     #ff6b6b;
      box-sizing: border-box;
    }
    *, *::before, *::after { box-sizing: inherit; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Roboto, Arial, sans-serif;
      background: var(--app-bg);
      color: var(--ink);
      display: flex; flex-direction: column; min-height: 100%;
    }

    /* ---- Toolbar ---------------------------------------------------------- */
    .toolbar {
      height: 64px; background: var(--toolbar); color: #fff;
      display: flex; align-items: center; padding: 0 16px;
      padding-top: env(safe-area-inset-top, 0px);
      box-shadow: 0 2px 5px rgba(0,0,0,.4);
    }
    .toolbar .icon-btn {
      background: none; border: none; color: #fff; cursor: pointer;
      width: 40px; height: 40px; border-radius: 50%;
      display: grid; place-items: center;
    }
    .toolbar .icon-btn:hover { background: rgba(255,255,255,.12); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 500; margin-left: 6px; }
    .brand .logo { width: 40px; height: 40px; display: grid; place-items: center; }
    .spacer { flex: 1; }
    .account {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,.15); color: #fff;
      border: none; cursor: pointer; font: 500 15px Roboto, Arial, sans-serif;
      padding: 8px 18px 8px 12px; border-radius: 22px;
    }
    .account:hover { background: rgba(255,255,255,.25); }

    /* ---- Login card ------------------------------------------------------- */
    .wrap { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 28px 16px 48px; }
    .card {
      width: 100%; max-width: 470px; background: var(--card);
      border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.5);
      padding: 28px 36px 40px;
    }
    h1 { font-size: 34px; font-weight: 700; margin: 6px 0 26px; color: #fff; }

    /* ---- Dark Material-style outlined field ------------------------------ */
    .field { position: relative; margin-bottom: 26px; }
    .field input {
      width: 100%; font: 16px/1.3 Roboto, Arial, sans-serif; color: var(--ink);
      background: transparent; border: 1px solid var(--field-bd);
      border-radius: 4px; padding: 18px 46px 18px 14px;
      transition: border-color .15s;
    }
    .field input:hover { border-color: var(--field-bd-h); }
    .field input:focus { outline: none; border: 2px solid #fff; padding: 17px 45px 17px 13px; }
    .field label {
      position: absolute; left: 11px; top: 18px; background: var(--card);
      padding: 0 5px; color: var(--muted); font-size: 16px; pointer-events: none;
      transition: all .13s ease;
    }
    .field input:focus + label,
    .field input:not(:placeholder-shown) + label { top: -9px; font-size: 12px; }
    .field input:focus + label { color: #fff; }
    .field input[aria-invalid="true"] { border-color: var(--error); }
    .field input[aria-invalid="true"] + label { color: var(--error); }

    .trailing {
      position: absolute; right: 8px; top: 27px; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--ink);
      width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    }
    .trailing:hover { background: rgba(255,255,255,.1); }

    .err { color: var(--error); font-size: 12px; margin: -20px 2px 16px; min-height: 14px; }

    /* ---- Links ------------------------------------------------------------ */
    a.link, .link-btn {
      color: var(--link); font-size: 14px; text-decoration: none;
      background: none; border: none; cursor: pointer; font-family: inherit;
    }
    a.link:hover, .link-btn:hover { text-decoration: underline; }
    .forgot { display: inline-block; margin: 0 0 22px; }

    /* ---- Log in button (pill, disabled until valid) ---------------------- */
    .login-area { text-align: center; }
    .btn-login {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-width: 270px; font: 500 16px Roboto, Arial, sans-serif; color: rgba(255,255,255,.65);
      background: var(--btn); border: none; border-radius: 24px; padding: 12px 20px;
      cursor: not-allowed; transition: background .15s, color .15s;
    }
    .btn-login.ready { color: #fff; background: var(--btn-ready); cursor: pointer; }
    .btn-login.ready:hover { background: #3f6a7a; }

    .remember { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 18px 0 30px; color: var(--ink); font-size: 15px; }
    .remember input { width: 18px; height: 18px; accent-color: var(--link); cursor: pointer; }

    .signup { text-align: center; }

    /* ---- Server status (rendered as TEXT, never HTML) -------------------- */
    .status { margin-top: 22px; padding: 10px 12px; border-radius: 4px; font-size: 13.5px; display: none; }
    .status.ok  { display:block; background:#204d2a; color:#a5e0ac; border:1px solid #356b40; }
    .status.bad { display:block; background:#4d2020; color:#ffb3b3; border:1px solid #6b3535; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header class="toolbar">
    <button class="icon-btn" aria-label="Open menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3V6m0 5h18v2H3v-2m0 5h18v2H3v-2z"/></svg>
    </button>
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
          <path d="M8 2h8l-1 4H9L8 2z" fill="#e53935"/>
          <path d="M7 6h10l-1 13a2 2 0 0 1-2 1.8H10A2 2 0 0 1 8 19L7 6z" fill="#fdd835"/>
          <text x="12" y="16" font-family="Roboto, Arial" font-size="7" font-weight="700" fill="#5a3a00" text-anchor="middle">JS</text>
        </svg>
      </span>
      OWASP Juice Shop
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" aria-label="Search">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5m-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    </button>
    <button class="account">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4m0 2c-3 0-8 1.5-8 4.5V21h16v-2.5c0-3-5-4.5-8-4.5z"/></svg>
      Account
    </button>
  </header>

  <main class="wrap">
    <section class="card">
      <h1>Login</h1>

      <form id="loginForm" novalidate>
        <div class="field">
          <input id="email" name="email" type="email" placeholder=" "
                 autocomplete="username" aria-describedby="emailErr" />
          <label for="email">Email*</label>
        </div>
        <div class="err" id="emailErr" role="alert"></div>

        <div class="field">
          <input id="password" name="password" type="password" placeholder=" "
                 autocomplete="current-password" aria-describedby="passErr" />
          <label for="password">Password*</label>
          <button type="button" class="trailing" id="togglePw" aria-label="Show password">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7m0 12a5 5 0 1 1 5-5 5 5 0 0 1-5 5m0-8a3 3 0 1 0 3 3 3 3 0 0 0-3-3z"/></svg>
          </button>
        </div>
        <div class="err" id="passErr" role="alert"></div>

        <a class="link forgot" href="#">Forgot your password?</a>

        <div class="login-area">
          <button type="submit" class="btn-login" id="submitBtn" aria-disabled="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M11 7 9.6 8.4 12.2 11H2v2h10.2l-2.6 2.6L11 17l5-5-5-5m9-4H12v2h8v14h-8v2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg>
            <span id="loginLabel">Log in</span>
          </button>
          <div class="remember">
            <input type="checkbox" id="remember" />
            <label for="remember">Remember me</label>
          </div>
        </div>
      </form>

      <div class="signup">
        <button type="button" class="link-btn" id="signup">Not yet a customer?</button>
      </div>

      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
